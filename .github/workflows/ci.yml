name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Quarto não é necessário aqui — `render_report` faz fallback para
      # markdown puro quando o binário não está no PATH (e os tests usam
      # esse caminho).
      - name: Install
        run: pip install -e ".[dev,estruturacao,ocr-cpu]"
      - name: Lint
        run: ruff check .
      - name: Test (skip integration)
        # tests/test_estruturacao_integration.py exige OPENAI_API_KEY real
        # e é pulado automaticamente em CI (marker `integration`).
        run: pytest -q -m "not integration"
