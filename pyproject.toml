[project]
name = "labdados-core"
version = "0.1.0"
description = "Núcleo compartilhado entre o backend do escritório de apoio do LabDados e o SDK Python labdados — lógica que precisa ficar idêntica nos dois lados (análise de viabilidade, regras de veredito, template do relatório)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LabDados / FGV Direito SP", email = "labdados.direitosp@fgv.br" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Mínimo absoluto: httpx para Datajud, jinja2 para renderizar o relatório.
# juscraper fica opcional porque só é usado em listagens de jurisprudência
# e sentenças — pesado de instalar (~50MB de deps).
dependencies = [
    "httpx>=0.27,<1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Análise de listagem por jurisprudência (cjsg) ou sentenças (cjpg).
# Sem este extra, apenas listagem='datajud' funciona.
juscraper = [
    "juscraper>=0.2",
]
# Para renderização do PDF é necessário também o binário do Quarto +
# Typst no sistema (não dá pra empacotar via pip). Sem o Quarto, o
# render_report devolve só o markdown.
all = [
    "labdados-core[juscraper]",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/jtrecenti/labdados-core"
Repository = "https://github.com/jtrecenti/labdados-core"
Issues = "https://github.com/jtrecenti/labdados-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labdados_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/labdados_core/templates/viability_report.qmd" = "labdados_core/templates/viability_report.qmd"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
