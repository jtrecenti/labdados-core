[project]
name = "labdados-core"
version = "0.4.0"
description = "Núcleo compartilhado entre o backend do escritório de apoio do LabDados e o SDK Python labdados — lógica que precisa ficar idêntica nos dois lados (análise de viabilidade, regras de veredito, template do relatório)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LabDados / FGV Direito SP", email = "labdados.direitosp@fgv.br" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# jinja2 para renderizar o template do relatório; juscraper para
# **todas** as chamadas a tribunais (Datajud + cjsg/cjpg). Antes da
# v0.4.0 o Datajud era HTTP direto via httpx, mas isso duplicava regras
# que o juscraper já tinha (alias, payload ES, fallback 504, auth) — ver
# jtrecenti/juscraper#180.
dependencies = [
    "jinja2>=3.1",
    # juscraper precisa do PR jtrecenti/juscraper#180 (data_ajuizamento_inicio/fim
    # em contar_processos), ainda não publicado no PyPI. Apontando pro main —
    # quando sair release com >=0.3, troca pra "juscraper>=0.3".
    "juscraper @ git+https://github.com/jtrecenti/juscraper@main",
]

[project.optional-dependencies]
# Para renderização do PDF é necessário também o binário do Quarto +
# Typst no sistema (não dá pra empacotar via pip). Sem o Quarto, o
# render_report devolve só o markdown.
all = [
    "labdados-core",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/lab-dados/labdados-core"
Repository = "https://github.com/lab-dados/labdados-core"
Issues = "https://github.com/lab-dados/labdados-core/issues"

[tool.hatch.metadata]
# Necessário pro git+https em dependencies enquanto juscraper>=0.3
# não está no PyPI.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labdados_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/labdados_core/templates/viability_report.qmd" = "labdados_core/templates/viability_report.qmd"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
